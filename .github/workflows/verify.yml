name: Verify LectureVault

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-and-desktop:
    name: Android and desktop checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Allow Gradle wrapper execution
        run: chmod +x gradlew
      - name: Run Android tests and assemble APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
      - name: Run desktop tests and package portable build
        run: ./gradlew :desktop:test :desktop:portableZip --console=plain
      - name: Upload Android release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  worker:
    name: Cloudflare Worker type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check Worker
        run: npm run check

  gateway-binary-smoke:
    name: Public gateway binary upload smoke check
    runs-on: ubuntu-latest
    steps:
      - name: Verify a binary POST reaches the public Worker
        run: |
          status="$(printf 'LV' | curl --http1.1 --max-time 20 --silent --show-error --output /dev/null --write-out '%{http_code}' --header 'Content-Type: application/octet-stream' --data-binary @- --request POST https://lecturevault-ai-gateway.aleksandrsimunin828.workers.dev/health)"
          test "$status" = "404"

  apple-sources:
    name: iPhone and Mac source build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iPhone simulator target without signing
        run: xcodebuild -project LectureVault.xcodeproj -scheme LectureVault -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build Mac target without signing
        if: always()
        run: xcodebuild -project LectureVault.xcodeproj -scheme LectureVaultMac -sdk macosx CODE_SIGNING_ALLOWED=NO build

  publish-android-prerelease:
    name: Publish Android prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android-and-desktop, worker, gateway-binary-smoke, apple-sources]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: release-apk
      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          asset="./release-apk/app-debug.apk#LectureVault-Android-${TAG#v}-gateway.apk"
          if gh release view "$TAG"; then
            gh release upload "$TAG" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --title "LectureVault ${TAG#v} — тестовая сборка" \
              --notes "Автоматически собранный APK. Перед публикацией прошли Android, Windows, iPhone/macOS и проверки сервера." \
              --prerelease
          fi
