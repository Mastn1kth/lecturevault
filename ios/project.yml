name: LectureVault
options:
  bundleIdPrefix: app.lecturevault
  deploymentTarget:
    iOS: "16.0"
targets:
  LectureVault:
    type: application
    platform: iOS
    sources: [LectureVault]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lecturevault.ios
        SWIFT_VERSION: 5.10
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: LectureVault/Info.plist
        CODE_SIGN_ENTITLEMENTS: LectureVault/LectureVault.entitlements
    scheme:
      testTargets: []
  LectureVaultMac:
    type: application
    platform: macOS
    sources: [LectureVault]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lecturevault.mac
        SWIFT_VERSION: 5.10
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: LectureVault/Info-mac.plist
        CODE_SIGN_ENTITLEMENTS: LectureVault/LectureVault.entitlements
